<!doctype html><html lang="zh-Hant"><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1,viewport-fit=cover'><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#141923"><title>得分五子棋</title><style>body{background:#141923;color:#eee;font:16px system-ui;max-width:700px;margin:24px auto;padding:12px}button,select,input{font:inherit;padding:9px;border-radius:8px;border:1px solid #687184;background:#273244;color:white}button{cursor:pointer}canvas{width:100%;max-width:600px;display:block;margin:16px auto;touch-action:manipulation}#panel{background:#242e3c;padding:16px;border-radius:12px}input{width:65px}h1{color:#eac58a}button:disabled{opacity:.4}@media(max-width:600px){body{margin:0 auto;padding: max(12px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom));}h1{font-size:23px}canvas{margin:10px auto}button,select,input{min-height:44px}#panel{padding:12px}input{width:48px}} </style></head><body><h1>得分五子棋 · Point Gomoku V3</h1><select id=mode><option value=ai>電腦對戰</option><option value=local>雙人對戰</option><option value=online>好友連線</option></select> <select id=level><option value=easy>簡單</option><option value=normal selected>普通</option><option value=hard>困難</option><option value=expert>專家</option></select> <button id=reset>重新開始</button><div id=net hidden></div><p id=info></p><canvas id=cv width=600 height=600></canvas><div id=panel></div><p>選擇直線上三個相鄰空位。每輪新增10分，各點至少1分，平手由非選位方取得。雙方均扣除下注，剩餘折半。</p><script src="game.js"></script></body></html>
