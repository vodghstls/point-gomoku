ze:23px}canvas{margin:10px auto}button,select,input{min-height:44px}#panel{padding:12px}input{width:48px}} a{color:#eac58a}nav{display:flex;gap:14px;flex-wrap:wrap;margin:16px 0}article{line-height:1.75}footer{font-size:13px;color:#b7c0ce;margin-top:30px}h2{color:#eac58a}</style></head><body><h1>Point Gomoku · 得分五子棋</h1><nav><a href="./">遊玩</a> <a href="rules.html">規則</a> <a href="strategy.html">策略</a> <a href="rules-en.html">English</a></nav><article><h2>遊戲規則</h2><p>雙方使用黑白棋，在 15×15 棋盤對戰。黑方先選位。每輪各得 10 分，加上前輪未用分數的一半（無條件捨去）。</p><p>選位方在 90 秒內選擇水平、垂直或斜向的三個連續空位。雙方秘密下注，每點至少 1 分且不得超過預算。高分者取得該點，平手由非選位方取得。雙方均扣除全部下注，三顆棋子全部落下後才判定勝負。</p><p>僅恰好五顆的完整連線有效，六顆以上長連無效。雙方同時形成有效連線時，較多者勝，數量相同則平局。無合法選位亦平局。每輪交換選位權。</p></article><button id="share">分享網站</button><span id="share-status" role="status"></span><script>document.getElementById('share').onclick=async()=>{const url="https://vodghstls.github.io/point-gomoku/rules.html";try{if(navigator.share)await navigator.share({title:'Point Gomoku',url});else{await navigator.clipboard.writeText(url);document.getElementById('share-status').textContent="已複製";}}catch(e){if(e.name!=='AbortError')prompt('URL',url)}};</script><footer>非官方同人遊戲，與節目製作方無隸屬關係。</footer></body></html>
